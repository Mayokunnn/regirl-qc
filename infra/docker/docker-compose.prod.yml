services:
  postgres:
    image: postgres:16
    container_name: regirl-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: regirl_qc
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: regirl-redis
    restart: always
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: regirl-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: regirl-api
    restart: always
    env_file: .env.production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - postgres
      - redis
      - minio

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    container_name: regirl-worker
    restart: always
    env_file: .env.production
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: regirl-web
    restart: always
    ports:
      - "127.0.0.1:8080:80"

  metabase:
    image: metabase/metabase:latest
    container_name: regirl-metabase
    restart: always
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - metabase_data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db

volumes:
  postgres_data:
  redis_data:
  minio_data:
  metabase_data:
